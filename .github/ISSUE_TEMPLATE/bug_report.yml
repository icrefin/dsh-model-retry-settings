name: Bug report
description: Report a reproducible defect in dsh-model-retry-settings so it can be fixed
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Fill in every field — incomplete reports are hard to
        act on. Redact secrets, tokens, provider credentials, internal hostnames, and
        personal data before pasting anything. A settings document or a log excerpt can
        itself be sensitive, so redact it too.

        **Security vulnerability?** Stop and read SECURITY.md instead. Never open a
        public issue for a vulnerability.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      description: Confirm each item before submitting.
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am running the latest release or a recent commit of main.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, version number, or commit SHA of dsh-model-retry-settings where the bug occurs.
      placeholder: "v1.0.0 or 1a2b3c4"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node version, and the DeepSeek Harness build you ran it against.
      placeholder: "macOS 15.5, Node 22.19.0, dsh 0.2.1-rc.3"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How was the plugin installed?
      description: Where the card appears depends on how the bundle reached the profile.
      options:
        - Settings → Plugins (the packed tarball)
        - A CLI-managed profile (`sh scripts/install.sh --profile <name>`)
        - The isolated profile from `sh scripts/dev-profile.sh`
        - A custom or hand-edited profile
        - Other (describe below)
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Which part misbehaved?
      options:
        - The card is missing from Settings → Model
        - The "Override provider retry policy" switch
        - The "Max retries" field or its 0–50 bound
        - Save / the staged settings write
        - The retry budget a failed request actually used
        - The entry does not activate (for example "failed to import")
        - Other (describe below)
    validations:
      required: true

  - type: input
    id: value
    attributes:
      label: Values involved
      description: What the switch and the field held, and what the provider declared if you know it.
      placeholder: "switch on, Max retries 3; provider declared mode: normal, maxRetries 5"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact, minimal steps. Number them. Include the command or the UI path.
      placeholder: |
        1. Open Settings → Model and set '...'
        2. Press Save
        3. Observe '...'
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including the full error text.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack trace, or screenshots
      description: Paste raw output, not a screenshot of text, where possible. Say which profile and which entry reported it, with credentials and personal data removed.
      render: text
    validations:
      required: false

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - "No — first time using this feature"
        - "Yes — it regressed in a later version"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Workaround
      description: Anything that makes the bug go away, even partly.
    validations:
      required: false

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
